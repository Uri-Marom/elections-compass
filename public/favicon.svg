<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <circle cx="50" cy="50" r="50" fill="#0a0a0a"/>

  <!-- Outer rings -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="white" stroke-width="0.5" opacity="0.25"/>

  <!-- 8 major tick marks (every 45°) -->
  <line x1="88" y1="50" x2="96" y2="50" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="76.9" y1="76.9" x2="82.5" y2="82.5" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="88" x2="50" y2="96" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="23.1" y1="76.9" x2="17.5" y2="82.5" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <line x1="12" y1="50" x2="4" y2="50" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="23.1" y1="23.1" x2="17.5" y2="17.5" stroke="white" stroke-width="0.8" opacity="0.4"/>
  <line x1="50" y1="12" x2="50" y2="4" stroke="white" stroke-width="1.2" opacity="0.6"/>
  <line x1="76.9" y1="23.1" x2="82.5" y2="17.5" stroke="white" stroke-width="0.8" opacity="0.4"/>

  <!-- 16 minor tick marks (every 22.5°) -->
  <line x1="79.6" y1="20.4" x2="83.0" y2="17.0" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="70.0" y1="12.0" x2="72.4" y2="8.5" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="70.0" y1="88.0" x2="72.4" y2="91.5" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="79.6" y1="79.6" x2="83.0" y2="83.0" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="20.4" y1="79.6" x2="17.0" y2="83.0" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="30.0" y1="88.0" x2="27.6" y2="91.5" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="30.0" y1="12.0" x2="27.6" y2="8.5" stroke="white" stroke-width="0.4" opacity="0.25"/>
  <line x1="20.4" y1="20.4" x2="17.0" y2="17.0" stroke="white" stroke-width="0.4" opacity="0.25"/>

  <!-- North needle — accent (#0891b2) right half, white left half -->
  <polygon points="50,10 54,48 50,50 46,48" fill="#0891b2"/>
  <polygon points="50,10 46,48 50,50 54,48" fill="white" opacity="0.6"/>

  <!-- South needle -->
  <polygon points="50,90 54,52 50,50 46,52" fill="white" opacity="0.5"/>
  <polygon points="50,90 46,52 50,50 54,52" fill="white" opacity="0.3"/>

  <!-- West needle -->
  <polygon points="10,50 48,54 50,50 48,46" fill="white" opacity="0.3"/>
  <polygon points="10,50 48,46 50,50 48,54" fill="white" opacity="0.5"/>

  <!-- East needle -->
  <polygon points="90,50 52,46 50,50 52,54" fill="white" opacity="0.5"/>
  <polygon points="90,50 52,54 50,50 52,46" fill="white" opacity="0.3"/>

  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#0891b2"/>
  <circle cx="50" cy="50" r="1.5" fill="white"/>
</svg>
